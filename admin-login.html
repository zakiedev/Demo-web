<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login – DegreeToCareer</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: var(--surface); padding: 40px; border-radius: var(--r-lg); box-shadow: var(--shadow-lg); width: 100%; max-width: 380px; border: 1px solid var(--line); }
        .login-card h2 { text-align: center; margin-bottom: 6px; font-size: 1.4rem; }
        .login-card p.sub { text-align: center; color: var(--text-sec); font-size: 0.85rem; margin-bottom: 24px; }
        .login-card input { width: 100%; padding: 12px 14px; margin-bottom: 14px; border: 1.5px solid var(--line); border-radius: var(--r-sm); font-size: 1rem; font-family: var(--font-body); }
        .login-card input:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-tint); }
        .error { color: var(--rose); margin-top: 10px; font-size: 0.86rem; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <div style="text-align:center;margin-bottom:12px;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--gold);margin:0 auto;"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <h2>Admin Login</h2>
        <p class="sub">DegreeToCareer content management</p>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="btn btn--primary btn--block" id="loginBtn">Login</button>
            <p id="errorMsg" class="error"></p>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://ujkfjalepcldduwbwddz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqa2ZqYWxlcGNsZGR1d2J3ZGR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NTUxMjgsImV4cCI6MjEwMTIzMTEyOH0.8wjBN2fuQolkagyCP7Hf_40CEhq3T2VZYtX96YEv65Y';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // If already logged in, skip straight to the dashboard
        (async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) window.location.href = 'admin-dashboard.html';
        })();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true; btn.textContent = 'Logging in…';
            const { error } = await supabase.auth.signInWithPassword({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            });
            if (error) {
                document.getElementById('errorMsg').textContent = error.message;
                btn.disabled = false; btn.textContent = 'Login';
            } else {
                window.location.href = 'admin-dashboard.html';
            }
        });
    </script>
</body>
</html>
